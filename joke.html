<!DOCTYPE html>
<html>
<head>
  <title>Joke Generator</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #0f0f0f, #1c1c1c);
      color: #f0f0f0;
      text-align: center;
      padding-top: 50px;
      min-height: 100vh;
      margin: 0;
    }
    h1 { font-size: 2.2em; }
    .categories { margin-top: 20px; }
    .categories button {
      font-size: 1em;
      background: #1e1e1e;
      border: 2px solid #555;
      color: white;
      border-radius: 20px;
      padding: 8px 18px;
      margin: 5px;
      cursor: pointer;
      transition: 0.2s;
    }
    .categories button:hover, .categories button.active {
      background: #f7b733;
      color: #111;
      border-color: #f7b733;
    }
    .search { margin-top: 20px; }
    .search input {
      padding: 10px;
      font-size: 1em;
      border-radius: 8px;
      border: none;
      width: 220px;
    }
    .search button {
      padding: 10px 18px;
      font-size: 1em;
      border-radius: 8px;
      border: none;
      background: #f7b733;
      color: #111;
      cursor: pointer;
      margin-left: 5px;
    }
    #joke {
      max-width: 500px;
      margin: 40px auto;
      font-size: 1.3em;
      background: #1e1e1e;
      border: 2px solid #444;
      border-radius: 15px;
      padding: 30px;
      min-height: 80px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    a { display: block; margin-top: 20px; color: #999; }
    a:hover { color: #f7b733; }
  </style>
</head>
<body>
  <h1>😂 Joke Generator</h1>
  <p>Pick a category, or search for a keyword</p>

  <div class="categories">
    <button class="cat active" data-cat="Any" onclick="setCategory('Any', this)">🎲 Any</button>
    <button class="cat" data-cat="Programming" onclick="setCategory('Programming', this)">💻 Programming</button>
    <button class="cat" data-cat="Animals" onclick="setCategory('Animals', this)">🐶 Animals</button>
    <button class="cat" data-cat="School" onclick="setCategory('School', this)">🏫 School</button>
    <button class="cat" data-cat="Food" onclick="setCategory('Food', this)">🍕 Food</button>
  </div>

  <div class="search">
    <input type="text" id="keyword" placeholder="Search a word e.g. cat, school">
    <button onclick="tellJoke()">Search</button>
  </div>

  <div id="joke">Ready when you are!</div>
  <button onclick="tellJoke()" style="margin-top:10px; padding:12px 25px; font-size:1.1em; background:#1e1e1e; border:2px solid #f7b733; color:white; border-radius:10px; cursor:pointer;">🎲 Random Joke</button>

  <a href="index.html">← Back to menu</a>

  <script>
    const jokes = [
      { text: "Why don't scientists trust atoms? Because they make up everything!", cat: "Any" },
      { text: "Why do programmers prefer dark mode? Because light attracts bugs.", cat: "Programming" },
      { text: "Why did the developer go broke? Because he used up all his cache.", cat: "Programming" },
      { text: "A SQL query walks into a bar, walks up to two tables and asks: Can I join you?", cat: "Programming" },
      { text: "Why don't skeletons fight each other? They don't have the guts.", cat: "Any" },
      { text: "Why did the scarecrow win an award? Because he was outstanding in his field.", cat: "Any" },
      { text: "Why do cats always win video games? Because they have nine lives.", cat: "Animals" },
      { text: "What do you call a dog that can do magic? A labracadabrador.", cat: "Animals" },
      { text: "Why did the cat sit on the computer? To keep an eye on the mouse.", cat: "Animals" },
      { text: "Why was the math book sad at school? It had too many problems.", cat: "School" },
      { text: "Why did the student eat his homework? Because the teacher said it was a piece of cake.", cat: "School" },
      { text: "What did the classroom clock do when it was hungry? It went back four seconds.", cat: "School" },
      { text: "Why did the pizza maker go out of business? He couldn't make enough dough.", cat: "Food" },
      { text: "Why did the banana go to the doctor? It wasn't peeling well.", cat: "Food" },
      { text: "I would tell you a joke about pizza, but it's a little cheesy.", cat: "Food" }
    ];

    let currentCategory = "Any";

    function setCategory(cat, btn) {
      currentCategory = cat;
      document.querySelectorAll('.cat').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('keyword').value = "";
      tellJoke();
    }

    function tellJoke() {
      const keyword = document.getElementById('keyword').value.trim().toLowerCase();

      let pool = jokes.filter(j => currentCategory === "Any" || j.cat === currentCategory);
      if (keyword) {
        pool = pool.filter(j => j.text.toLowerCase().includes(keyword));
      }

      if (pool.length === 0) {
        document.getElementById('joke').innerText = "No joke found for that. Try another word or category!";
        return;
      }

      const random = pool[Math.floor(Math.random() * pool.length)];
      document.getElementById('joke').innerText = random.text;
    }
  </script>
</body>
</html>
