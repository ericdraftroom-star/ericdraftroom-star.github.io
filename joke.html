<!DOCTYPE html>
<html>
<head>
  <title>Joke Generator</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #0f0f0f, #1c1c1c);
      color: #f0f0f0;
      text-align: center;
      padding-top: 60px;
      min-height: 100vh;
      margin: 0;
    }
    h1 { font-size: 2.2em; }
    #joke {
      max-width: 500px;
      margin: 40px auto;
      font-size: 1.4em;
      background: #1e1e1e;
      border: 2px solid #444;
      border-radius: 15px;
      padding: 30px;
      min-height: 80px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    button {
      font-size: 1.2em;
      background: #1e1e1e;
      border: 2px solid #f7b733;
      color: white;
      border-radius: 10px;
      padding: 12px 25px;
      cursor: pointer;
      transition: 0.2s;
    }
    button:hover {
      background: #f7b733;
      color: #111;
    }
    a {
      display: block;
      margin-top: 30px;
      color: #999;
    }
    a:hover {
      color: #f7b733;
    }
  </style>
</head>
<body>
  <h1>😂 Joke Generator</h1>
  <p>Click for a random joke (fetched live from the internet)</p>

  <div id="joke">Ready when you are!</div>
  <button onclick="tellJoke()">Tell me a joke</button>

  <a href="index.html">← Back to menu</a>

  <script>
    async function tellJoke() {
      document.getElementById('joke').innerText = "Loading...";
      try {
        const response = await fetch("https://official-joke-api.appspot.com/random_joke");
        const data = await response.json();
        document.getElementById('joke').innerText = data.setup + " — " + data.punchline;
      } catch (error) {
        document.getElementById('joke').innerText = "Oops, couldn't fetch a joke. Try again!";
      }
    }
  </script>
</body>
</html>
